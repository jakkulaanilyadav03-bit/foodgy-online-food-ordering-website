<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Foodgy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .order-history-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
            background: var(--dark-bg, #0f0f0f);
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            color: #f5f5f5;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #a0a0a0;
        }

        .filter-section {
            background: var(--dark-card, #161616);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            color: #d0d0d0;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .filter-group select, .filter-group input {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            color: #f5f5f5;
            font-size: 0.9rem;
        }

        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #FF6B35;
            background: rgba(255, 107, 53, 0.05);
        }

        .orders-list {
            display: grid;
            gap: 1.5rem;
        }

        .order-card {
            background: var(--dark-card, #161616);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .order-card:hover {
            border-color: #FF6B35;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.1);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .order-id-date {
            display: flex;
            flex-direction: column;
        }

        .order-id {
            color: #f5f5f5;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .order-date {
            color: #a0a0a0;
            font-size: 0.85rem;
        }

        .order-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #FFC107;
        }

        .status-confirmed {
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
        }

        .status-preparing {
            background: rgba(156, 39, 176, 0.2);
            color: #9C27B0;
        }

        .status-on-the-way {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
        }

        .status-delivered {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status-cancelled {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #a0a0a0;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }

        .detail-value {
            color: #f5f5f5;
            font-weight: 600;
        }

        .order-items-preview {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .items-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .item-badge {
            background: rgba(255, 107, 53, 0.2);
            color: #FF6B35;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .order-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8555 100%);
            color: white;
        }

        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }

        .action-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #f5f5f5;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: #a0a0a0;
        }

        .empty-state i {
            font-size: 3.5rem;
            color: #404040;
            margin-bottom: 1rem;
            display: block;
        }

        .empty-state a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            display: inline-block;
        }

        .sort-section {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        @media (max-width: 768px) {
            .order-card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .order-actions {
                flex-direction: column;
            }

            .filter-section {
                flex-direction: column;
            }

            .sort-section {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>

<body style="background: var(--dark-bg, #0f0f0f);">
    <!-- Header with Navigation -->
    <header style="background: rgba(22, 22, 22, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 100;">
        <nav class="navbar flex between wrapper">
            <a href="index.html" class="logo">Foodgy.</a>

            <ul class="navlist flex gap-3">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="order-history.html" style="color: #FF6B35;">Orders</a></li>
            </ul>

            <div class="desktop-action flex gap-2">
                <div id="profileDropdown" class="profile-dropdown">
                    <button id="profileBtn" class="btn profile-btn">
                        User <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div class="profile-menu">
                        <a href="profile.html">My Profile</a>
                        <a href="#" id="logoutBtn">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="order-history-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Order History</h1>
            <p>View and manage all your orders</p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="">All Orders</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="preparing">Preparing</option>
                    <option value="on-the-way">On The Way</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="dateFilter">From Date:</label>
                <input type="date" id="dateFilter">
            </div>

            <div class="sort-section">
                <label for="sortBy">Sort By:</label>
                <select id="sortBy">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="highest">Highest Amount</option>
                    <option value="lowest">Lowest Amount</option>
                </select>
            </div>
        </div>

        <!-- Orders List -->
        <div class="orders-list" id="ordersContainer">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>No orders found</p>
                <a href="index.html#menu">Start ordering now!</a>
            </div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div id="orderDetailModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto; padding: 2rem 1rem;">
        <div style="background: var(--dark-card, #161616); max-width: 600px; margin: 0 auto; border-radius: 16px; padding: 2rem; border: 1px solid rgba(255, 255, 255, 0.08);">
            <button onclick="document.getElementById('orderDetailModal').style.display='none'" style="float: right; background: none; border: none; color: #f5f5f5; font-size: 1.5rem; cursor: pointer;">×</button>
            
            <h2 style="color: #f5f5f5; margin-bottom: 1rem;" id="modalOrderId"></h2>

            <div id="modalOrderDetails" style="color: #a0a0a0; margin-bottom: 1.5rem;"></div>

            <h3 style="color: #FF6B35; margin-bottom: 1rem;">Items Ordered:</h3>
            <div id="modalOrderItems" style="background: rgba(255, 255, 255, 0.02); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;"></div>

            <h3 style="color: #FF6B35; margin-bottom: 1rem;">Delivery Address:</h3>
            <p id="modalDeliveryAddress" style="color: #a0a0a0; background: rgba(255, 255, 255, 0.02); padding: 1rem; border-radius: 12px;"></p>

            <div style="border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 1.5rem; padding-top: 1.5rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: #a0a0a0;">Subtotal:</span>
                    <span id="modalSubtotal" style="color: #f5f5f5;">$0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span style="color: #a0a0a0;">Delivery Fee:</span>
                    <span id="modalDeliveryFee" style="color: #f5f5f5;">$0</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700;">
                    <span style="color: #f5f5f5;">Total:</span>
                    <span id="modalTotal" style="color: #FF6B35;">$0</span>
                </div>
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button id="reorderBtn" style="flex: 1; padding: 12px; background: linear-gradient(135deg, #FF6B35 0%, #FF8555 100%); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Reorder</button>
                <button onclick="document.getElementById('orderDetailModal').style.display='none'" style="flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #f5f5f5; font-weight: 600; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js"></script>

    <!-- Config and Scripts -->
    <script src="firebase-config.js"></script>
    <script src="order-history.js"></script>
</body>

</html>
