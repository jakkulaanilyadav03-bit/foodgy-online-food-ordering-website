<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Checkout - Foodgy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        .checkout-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2.5rem;
            background: var(--dark-card, #161616);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-primary, #f5f5f5);
        }
        .checkout-container h1 {
            color: var(--text-primary, #f5f5f5);
            margin-bottom: 2rem;
            text-align: center;
        }
        .checkout-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
        }
        .form-section h3, .summary-section h3 {
            margin-bottom: 1.5rem;
            color: var(--gold-finger, #FF6B35);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #a0a0a0;
            font-size: 0.95rem;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: #111111;
            color: #f5f5f5;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 15px rgba(255,107,53,0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .summary-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 1.2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .summary-item-info {
            flex: 1;
        }
        .summary-item-info h4 {
            margin: 0 0 0.3rem 0;
            font-size: 1.05rem;
            color: #f5f5f5;
        }
        .summary-item-info small {
            color: #a0a0a0;
            font-size: 0.9rem;
        }
        .summary-item-price {
            font-weight: 600;
            min-width: 80px;
            text-align: right;
            color: #FF6B35;
            font-size: 1.1rem;
        }
        .order-total {
            display: flex;
            justify-content: space-between;
            padding: 1.5rem;
            background: rgba(255,107,53,0.05);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 1.5rem;
            color: #f5f5f5;
        }
        .order-total #finalTotal {
            color: #FF6B35;
            font-size: 1.4rem;
        }
        .payment-methods {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .payment-methods h4 {
            color: #f5f5f5;
            margin-bottom: 1rem;
        }
        .payment-option {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: #111111;
            transition: all 0.3s;
            cursor: pointer;
        }
        .payment-option:hover {
            border-color: rgba(255,107,53,0.5);
        }
        .payment-option input[type="radio"] {
            margin-right: 1rem;
            accent-color: #FF6B35;
            transform: scale(1.2);
        }
        .payment-option label {
            color: #f5f5f5;
            margin: 0;
            cursor: pointer;
            width: 100%;
        }
        .place-order-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,107,53,0.3);
        }
        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.5);
        }
        .back-btn {
            width: 100%;
            padding: 1.2rem;
            background: transparent;
            color: #a0a0a0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            margin-top: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .empty-message {
            text-align: center;
            padding: 4rem 2rem;
            color: #a0a0a0;
            background: #111111;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .empty-message p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        
        /* Success Modal Styles */
        .success-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: all 0.3s ease;
        }
        .success-modal.show {
            opacity: 1; pointer-events: auto;
        }
        .success-modal-content {
            background: #161616; padding: 3rem 2.5rem;
            border-radius: 24px; text-align: center; max-width: 450px; width: 90%;
            border: 1px solid rgba(255,107,53,0.3);
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            transform: translateY(30px) scale(0.95); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #f5f5f5;
        }
        .success-modal.show .success-modal-content {
            transform: translateY(0) scale(1);
        }
        .success-modal-icon {
            font-size: 5rem; color: #10B981; margin-bottom: 1.5rem;
            display: inline-block;
        }
        .success-modal h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #FF6B35; margin-bottom: 0.5rem;
        }
        .success-modal p {
            color: #a0a0a0; font-size: 1.05rem; margin-bottom: 1.5rem; line-height: 1.5;
        }
        .success-modal .order-id-badge {
            display: inline-block; background: rgba(255,255,255,0.05);
            padding: 0.5rem 1rem; border-radius: 8px; font-family: monospace;
            color: #FF6B35; font-size: 1.1rem; margin-bottom: 2rem;
            border: 1px dashed rgba(255,107,53,0.3);
        }

        @media (max-width: 768px) {
            .checkout-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .checkout-container {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar flex between wrapper">
            <a href="index.html" class="logo">Foodgy.</a>
            <a href="index.html" style="font-size: 1rem;">← Back to Home</a>
        </nav>
    </header>

    <main>
        <div class="checkout-container">
            <h1>Checkout Your Order</h1>
            
            <div id="emptyCart" class="empty-message" style="display:none;">
                <p>Your cart is empty!</p>
                <a href="index.html" class="btn">Continue Shopping</a>
            </div>

            <div id="checkoutForm" style="display:none;">
                <div class="checkout-grid">
                    <!-- Delivery Details Form -->
                    <div class="form-section">
                        <h3>Delivery Details</h3>
                        <form id="deliveryForm">
                            <div class="form-group">
                                <label for="o_name">Full Name *</label>
                                <input type="text" id="o_name" required placeholder="Your Name">
                            </div>

                            <div class="form-group">
                                <label for="o_email">Email *</label>
                                <input type="email" id="o_email" required placeholder="your@email.com">
                            </div>

                            <div class="form-group">
                                <label for="o_phone">Phone Number *</label>
                                <input type="tel" id="o_phone" required placeholder="+91 98765 43210">
                            </div>

                            <div class="form-group">
                                <label for="o_address">Delivery Address *</label>
                                <textarea id="o_address" required placeholder="Enter your complete delivery address"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="o_city">City *</label>
                                <input type="text" id="o_city" required placeholder="City">
                            </div>

                            <div class="form-group">
                                <label for="o_zip">Postal Code *</label>
                                <input type="text" id="o_zip" required placeholder="Postal Code">
                            </div>

                            <div class="form-group">
                                <label for="o_notes">Special Instructions (Optional)</label>
                                <textarea id="o_notes" placeholder="Any special requests?"></textarea>
                            </div>

                            <div class="payment-methods">
                                <h4 style="margin-bottom: 1rem;">Payment Method</h4>
                                <div class="payment-option">
                                    <input type="radio" id="payment_cod" name="payment" value="cod" checked>
                                    <label for="payment_cod" style="margin: 0;">Cash on Delivery (COD)</label>
                                </div>
                                <div class="payment-option">
                                    <input type="radio" id="payment_card" name="payment" value="card">
                                    <label for="payment_card" style="margin: 0;">Credit/Debit Card</label>
                                </div>
                                <div class="payment-option">
                                    <input type="radio" id="payment_upi" name="payment" value="upi">
                                    <label for="payment_upi" style="margin: 0;">UPI</label>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Order Summary -->
                    <div class="summary-section">
                        <h3>Order Summary</h3>
                        <div id="orderItems"></div>
                        
                        <div class="order-total">
                            <span>Total:</span>
                            <span id="finalTotal">$0.00</span>
                        </div>

                        <button class="place-order-btn" id="placeOrderBtn">Place Order</button>
                        <button class="back-btn" onclick="window.location.href='index.html'">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="success-modal" id="successModal">
        <div class="success-modal-content">
            <div class="success-modal-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2>Order Confirmed!</h2>
            <p>Your delicious food is being prepared and will be delivered to you shortly.</p>
            <div class="order-id-badge" id="modalOrderId">Order #000000</div>
            <button class="place-order-btn" onclick="window.location.href='index.html'" style="margin-top: 0;">Back to Home</button>
        </div>
    </div>

    <!-- Firebase Scripts (loaded BEFORE inline script) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const STORAGE_CART_KEY = 'checkoutCart';
        const STORAGE_USER_KEY = 'userAccount';
        const STORAGE_ORDERS_KEY = 'placedOrders';

        function formatPrice(n) {
            return `$${n.toFixed(2)}`;
        }

        function showToast(message, type = 'success', duration = 2500) {
            const toast = document.createElement('div');
            toast.className = `mini-toast ${type}`;
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.right = '1rem';
            toast.style.bottom = '1rem';
            toast.style.padding = '0.6rem 1rem';
            toast.style.borderRadius = '8px';
            toast.style.boxShadow = '0 6px 18px rgba(0,0,0,0.15)';
            toast.style.zIndex = '2000';
            toast.style.background = (type === 'success') ? '#10B981' : '#F87171';
            toast.style.color = '#fff';
            toast.style.fontSize = '0.95rem';
            toast.style.opacity = '0';
            toast.style.transition = 'opacity .25s ease, transform .25s ease';
            toast.style.transform = 'translateY(8px)';

            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
            });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function loadOrder() {
            const cart = JSON.parse(localStorage.getItem(STORAGE_CART_KEY) || '[]');
            const user = JSON.parse(localStorage.getItem(STORAGE_USER_KEY) || 'null');

            if (!cart || cart.length === 0) {
                document.getElementById('emptyCart').style.display = 'block';
                document.getElementById('checkoutForm').style.display = 'none';
                return;
            }

            document.getElementById('checkoutForm').style.display = 'block';

            // Pre-fill user info if available
            if (user) {
                document.getElementById('o_name').value = user.name || '';
                document.getElementById('o_email').value = user.email || '';
                document.getElementById('o_phone').value = user.phone || '';
                document.getElementById('o_address').value = user.address || '';
            }

            // Display order items
            let total = 0;
            let html = '';

            cart.forEach(item => {
                // Robust price parsing in case priceNum is missing
                let pNum = item.priceNum;
                if (typeof pNum !== 'number' || isNaN(pNum)) {
                    pNum = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                }

                const itemTotal = pNum * item.qty;
                total += itemTotal;
                html += `
                    <div class="summary-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="summary-item-info">
                            <h4>${item.name}</h4>
                            <small>Qty: ${item.qty}</small>
                        </div>
                        <div class="summary-item-price">${formatPrice(itemTotal)}</div>
                    </div>
                `;
            });

            document.getElementById('orderItems').innerHTML = html;
            document.getElementById('finalTotal').textContent = formatPrice(total);
        }

        document.getElementById('placeOrderBtn').addEventListener('click', async () => {
            const name = document.getElementById('o_name').value.trim();
            const email = document.getElementById('o_email').value.trim();
            const phone = document.getElementById('o_phone').value.trim();
            const address = document.getElementById('o_address').value.trim();
            const city = document.getElementById('o_city').value.trim();
            const zip = document.getElementById('o_zip').value.trim();
            const notes = document.getElementById('o_notes').value.trim();
            const payment = document.querySelector('input[name="payment"]:checked').value;

            if (!name || !email || !phone || !address || !city || !zip) {
                showToast('Please fill all required fields', 'error');
                return;
            }

            const cart = JSON.parse(localStorage.getItem(STORAGE_CART_KEY) || '[]');
            let subtotal = 0;
            cart.forEach(item => {
                let pNum = item.priceNum;
                if (typeof pNum !== 'number' || isNaN(pNum)) {
                    pNum = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                }
                subtotal += pNum * item.qty;
            });

            const deliveryFee = 5.00;
            const total = subtotal + deliveryFee;
            const orderId = 'ORD-' + Date.now();

            const order = {
                id: orderId,
                name,
                email,
                phone,
                deliveryAddress: address + ', ' + city + ' ' + zip,
                notes,
                payment,
                items: cart,
                subtotal,
                deliveryFee,
                total,
                status: 'pending',
                createdAt: new Date(),
                expectedDelivery: new Date(Date.now() + 45 * 60000)
            };

            try {
                // Save to localStorage (always works)
                let orders = JSON.parse(localStorage.getItem(STORAGE_ORDERS_KEY) || '[]');
                orders.push(order);
                localStorage.setItem(STORAGE_ORDERS_KEY, JSON.stringify(orders));

                // Try to save to Firebase if available (optional fallback)
                try {
                    if (typeof firebase !== 'undefined' && firebase.auth && firebase.firestore) {
                        const user = firebase.auth().currentUser;
                        if (user) {
                            const db = firebase.firestore();
                            await db.collection('users').doc(user.uid).collection('orders').doc(orderId).set(order);
                            await db.collection('users').doc(user.uid).update({
                                address: order.deliveryAddress,
                                phone: phone,
                                lastOrder: new Date()
                            });
                        }
                    }
                } catch (fbError) {
                    // Firebase not available or error - that's okay, localStorage already saved it
                    console.log('Firebase save skipped (not configured):', fbError.message);
                }

                // Update user profile
                const user = JSON.parse(localStorage.getItem(STORAGE_USER_KEY) || 'null') || {};
                user.address = order.deliveryAddress;
                user.phone = phone;
                user.lastOrder = new Date().toISOString();
                localStorage.setItem(STORAGE_USER_KEY, JSON.stringify(user));

                localStorage.removeItem(STORAGE_CART_KEY);
                document.getElementById('modalOrderId').textContent = `Order #${orderId}`;
                document.getElementById('successModal').classList.add('show');
                showToast('Order placed successfully!', 'success');
            } catch (error) {
                console.error('Error placing order:', error);
                showToast('Error placing order: ' + error.message, 'error');
            }
        });

        window.addEventListener('load', loadOrder);
    </script>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js"></script>
    <script src="firebase-config.js"></script>
</body>
</html>
