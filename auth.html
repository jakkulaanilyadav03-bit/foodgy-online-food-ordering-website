<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - Foodgy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
        }

        .auth-card {
            background: var(--dark-card, #161616);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FF6B35 0%, #FFB366 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-header p {
            color: #a0a0a0;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: #d0d0d0;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            color: #f5f5f5;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6B35;
            background: rgba(255, 107, 53, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group input::placeholder {
            color: #707070;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8555 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .toggle-auth p {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .toggle-auth a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-auth a:hover {
            color: #FFB366;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 1rem;
        }

        .forgot-password a {
            color: #FF6B35;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #FFB366;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 1rem;
            color: #707070;
            font-size: 0.85rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #FF6B35;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #FFB366;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2rem 1.5rem;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-link">← Back to Home</a>

            <div class="auth-header">
                <h1>Foodgy.</h1>
                <p>Your favorite food, delivered fast</p>
            </div>

            <!-- Sign In Form -->
            <form id="signInForm">
                <h2 style="color: #f5f5f5; margin-bottom: 1.5rem; font-size: 1.3rem;">Sign In</h2>

                <div class="form-group">
                    <label for="signInEmail">Email Address</label>
                    <input type="email" id="signInEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="signInPassword">Password</label>
                    <input type="password" id="signInPassword" placeholder="Enter your password" required>
                </div>

                <div class="forgot-password">
                    <a href="#" id="resetPasswordBtn">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signUpForm" style="display: none;">
                <h2 style="color: #f5f5f5; margin-bottom: 1.5rem; font-size: 1.3rem;">Create Account</h2>

                <div class="form-group">
                    <label for="signUpName">Full Name</label>
                    <input type="text" id="signUpName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="signUpEmail">Email Address</label>
                    <input type="email" id="signUpEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="signUpPassword">Password</label>
                    <input type="password" id="signUpPassword" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="signUpConfirmPassword">Confirm Password</label>
                    <input type="password" id="signUpConfirmPassword" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div class="toggle-auth">
                <p>
                    <span id="toggleText">Don't have an account?</span>
                    <a id="toggleAuthMode" href="#"> <span id="toggleLink">Sign Up</span></a>
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" style="display: none;"></div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js"></script>

    <!-- Config and Auth Scripts -->
    <script src="firebase-config.js"></script>
    <script src="firebase-auth.js"></script>

    <script>
        // Redirect if already logged in
        if (isUserAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        // Toggle between Sign In and Sign Up
        const toggleAuthMode = document.getElementById('toggleAuthMode');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');

        toggleAuthMode.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signInForm').style.display = 
                document.getElementById('signInForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('signUpForm').style.display = 
                document.getElementById('signUpForm').style.display === 'none' ? 'block' : 'none';

            if (toggleText.textContent === "Don't have an account?") {
                toggleText.textContent = 'Already have an account?';
                toggleLink.textContent = 'Sign In';
            } else {
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign Up';
            }
        });
    </script>
</body>

</html>
